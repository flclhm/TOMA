<html lang="ja">

  <title>英単語SRSマスター（ターゲット1900 / 基本1200）</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      margin: 0;
      padding: 14px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s ease;
    }
    body.mode-basic {
      background: #ecfdf5;
    }
    .app-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-top: 5px solid #3182ce;
      transition: border-color 0.3s ease;
    }
    .app-card.card-basic {
      border-top-color: #0d9488;
    }
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #edf2f7;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .mode-tab {
      border: none;
      border-radius: 9px;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: #4a5568;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .mode-tab.active-1900 {
      background: #3182ce;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(49, 130, 206, 0.35);
    }
    .mode-tab.active-basic {
      background: linear-gradient(135deg, #0d9488, #10b981);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
    }
    .timer-bar-bg {
      width: 100%;
      height: 6px;
      background: #edf2f7;
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0 18px 0;
    }
    .timer-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #48bb78, #ecc94b, #f56565);
      transition: width 0.08s linear;
    }
    .gauge-container {
      background: #f0fdfa;
      border: 1.5px solid #99f6e4;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }
    .gauge-container.gauge-hot {
      background: #fffbeb;
      border-color: #f6ad55;
      box-shadow: 0 0 12px rgba(246, 173, 85, 0.25);
    }
    .gauge-container.gauge-max {
      background: linear-gradient(135deg, #fefce8, #fff7ed);
      border-color: #f59e0b;
      animation: pulseGlow 0.9s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 8px rgba(245, 158, 11, 0.35); }
      to { box-shadow: 0 0 18px rgba(245, 158, 11, 0.75); }
    }
    .gauge-bar-bg {
      width: 100%;
      height: 14px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.12);
    }
    .gauge-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
      position: relative;
    }
    .gauge-bar-fill.tier-1 {
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    .gauge-bar-fill.tier-2 {
      background: linear-gradient(90deg, #10b981, #84cc16, #eab308);
    }
    .gauge-bar-fill.tier-3 {
      background: linear-gradient(90deg, #f59e0b, #f97316, #ef4444);
    }
    .gauge-bar-fill.tier-4 {
      background: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6, #3b82f6, #10b981);
      background-size: 200% 100%;
      animation: rainbowShift 1.4s linear infinite;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .gauge-ticks {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-evenly;
      pointer-events: none;
    }
    .gauge-tick {
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.45);
    }
    .btn-option {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      color: #2d3748;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-option:active {
      transform: scale(0.98);
    }
    .btn-option:disabled {
      cursor: default;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .burst-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
      animation: overlayFade 1.5s ease-out forwards;
    }
    @keyframes overlayFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
    .burst-banner {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.45);
      border: 3px solid #fef08a;
      animation: popBurst 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popBurst {
      0% { transform: scale(0.4) rotate(-6deg); opacity: 0; }
      60% { transform: scale(1.12) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .confetti-piece {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFly 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFly {
      0% {
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1) rotate(var(--rot));
        opacity: 0;
      }
    }
  </style>

    const SET_SIZE_1900 = 10;
    const SET_SIZE_BASIC = 20;

    const BASIC_GAUGE_TARGET = 50; // 50問正解ごとに15分
    const BASIC_REWARD_MINUTES = 15;

    // JST日付文字列 (YYYY-MM-DD) を厳密に取得
    function getTodayJST() {
      const formatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      return formatter.format(new Date()).replace(/\//g, '-');
    }

    // 日付に日数を足してYYYY-MM-DDを返す
    function addDays(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2] + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // 1900モード：ポイントからスマホ時間（分）と現在レートを計算（時間逓減制）
    function pointsToMinutesInfo(points) {
      if (!points || points <= 0) return { minutes: 0, exactMin: 0, displayMin: "0", currentRate: 100 };

      const stages = [
        { maxMin: 20, rate: 1.0 },
        { maxMin: 20, rate: 0.8 },
        { maxMin: 20, rate: 0.6 },
        { maxMin: 20, rate: 0.5 },
        { maxMin: 20, rate: 0.4 },
        { maxMin: 20, rate: 0.3 },
        { maxMin: Infinity, rate: 0.2 }
      ];

      let remPoints = points;
      let totalMinutes = 0.0;
      let currentRate = 100;

      for (const stage of stages) {
        if (remPoints <= 0) break;
        const maxPtsForStage = stage.maxMin / stage.rate;
        const takePts = Math.min(remPoints, maxPtsForStage);

        totalMinutes += takePts * stage.rate;
        remPoints -= takePts;
        currentRate = Math.round(stage.rate * 100);
      }

      return {
        minutes: Math.floor(totalMinutes),
        exactMin: totalMinutes,
        displayMin: totalMinutes.toFixed(1),
        currentRate: currentRate
      };
    }

    // 日次統計の安全正規化
    function normalizeDailyStat(stat) {
      return {
        points: stat?.points || 0,
        rewardedWords: Array.isArray(stat?.rewardedWords) ? stat.rewardedWords : [],
        basicFastCorrect: stat?.basicFastCorrect || 0,
        basicCompletions: stat?.basicCompletions || 0,
        basicRewardedWords: Array.isArray(stat?.basicRewardedWords) ? stat.basicRewardedWords : []
      };
    }

    // ローカルストレージの初期化・読み込み（既存の1900データをそのまま引き継ぐ）
    function loadAppData() {
      const defaultData = {
        dailyStats: {},
        wordProgress: {},
        newWordPointer: 1,
        exchangeRate: 1,
        basicWordProgress: {},
        basicNewWordPointer: 1,
        basicGaugeCount: 0,
        soundEnabled: true,
        lastMode: '1900'
      };
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          return {
            ...defaultData,
            ...parsed,
            dailyStats: parsed.dailyStats || {},
            wordProgress: parsed.wordProgress || {},
            basicWordProgress: parsed.basicWordProgress || {},
            basicNewWordPointer: parsed.basicNewWordPointer || 1,
            basicGaugeCount: typeof parsed.basicGaugeCount === 'number' ? parsed.basicGaugeCount : 0,
            soundEnabled: typeof parsed.soundEnabled === 'boolean' ? parsed.soundEnabled : true,
            lastMode: parsed.lastMode === 'basic' ? 'basic' : '1900'
          };
        }
      } catch (e) {
        console.error("Failed to load data", e);
      }
      return defaultData;
    }

    function saveAppData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error("Failed to save data", e);
      }
    }

        return ctx;
      }

      function playTone(freq, startTime, duration, type = 'triangle', gainPeak = 0.16) {
        try {
          const ac = getCtx();
          if (!ac) return;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(gainPeak, startTime + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.02);
        } catch (e) {}
      }

      // ゲージ上昇音（1〜49にかけてピッチがじわじわ上昇、10問節目で少し華やかに）
      function playCharge(gaugeValue) {
        try {
          const ac = getCtx();
          if (!ac) return;
          const now = ac.currentTime;
          const clamped = Math.max(1, Math.min(49, gaugeValue));
          // D4 (293.7Hz) から D6 (1174.7Hz) 付近へ滑らかに2オクターブ上昇
          const semitones = (clamped - 1) * (24 / 48);
          const baseFreq = 293.66 * Math.pow(2, semitones / 12);

          playTone(baseFreq, now, 0.14, 'triangle', 0.18);
          playTone(baseFreq * 1.5, now + 0.03, 0.11, 'sine', 0.09);

          // 10問節目・45問以上はちょっとしたきらめきを追加
          if (clamped % 10 === 0 || clamped >= 45) {
            playTone(baseFreq * 2, now + 0.06, 0.16, 'sine', 0.11);
          }
        } catch (e) {}
      }

      // 50問達成時のはじける音（クラッカー破裂＋ファンファーレ）
      function playBurst() {
        try {
          const ac = getCtx();
          if (!ac) return;
          const now = ac.currentTime;

          // 1. ポンッ・パチパチッと弾けるノイズバースト
          const burstOffsets = [0, 0.055, 0.11, 0.18];
          burstOffsets.forEach((offset, idx) => {
            const bufferSize = Math.floor(ac.sampleRate * 0.09);
            const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
            }
            const noise = ac.createBufferSource();
            noise.buffer = buffer;

            const filter = ac.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1400 + idx * 550, now + offset);
            filter.Q.setValueAtTime(1.4, now + offset);

            const gain = ac.createGain();
            gain.gain.setValueAtTime(idx === 0 ? 0.32 : 0.18, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.09);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ac.destination);
            noise.start(now + offset);
          });

          // 2. 駆け上がるファンファーレ和音 (C5-E5-G5-C6-E6-G6)
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
          notes.forEach((freq, i) => {
            playTone(freq, now + 0.03 + i * 0.055, 0.32, 'triangle', 0.16);
          });
          // 最後の明るい着地和音
          [1046.50, 1318.51, 1567.98].forEach((freq) => {
            playTone(freq, now + 0.36, 0.55, 'sine', 0.11);
          });
        } catch (e) {}
      }

      // 通常の軽い正解音
      function playSoftCorrect() {
        try {
          const ac = getCtx();
          if (!ac) return;
          const now = ac.currentTime;
          playTone(587.33, now, 0.09, 'sine', 0.12);
          playTone(880.0, now + 0.05, 0.12, 'sine', 0.12);
        } catch (e) {}
      }

      // 不正解音
      function playWrong() {
        try {
          const ac = getCtx();
          if (!ac) return;
          const now = ac.currentTime;
          playTone(196.0, now, 0.14, 'sawtooth', 0.08);
          playTone(155.56, now + 0.09, 0.18, 'sawtooth', 0.08);
        } catch (e) {}
      }

      return { playCharge, playBurst, playSoftCorrect, playWrong };
    })();

    // --- ターゲット1900用：セット作成関数 ---
    function createNextSet1900(appData, vocab, today) {
      let setList = [];
      const wp = appData.wordProgress || {};

      // 1. 復習期日（nextReview <= 今日）に達している単語を抽出
      const dueWordIds = Object.keys(wp)
        .map(Number)
        .filter(id => wp[id].nextReview && wp[id].nextReview <= today && wp[id].level > 0);

      const shuffledDue = [...dueWordIds].sort(() => Math.random() - 0.5);
      for (const id of shuffledDue) {
        if (setList.length >= SET_SIZE_1900) break;
        const word = vocab.find(v => v.id === id);
        if (word) setList.push({ ...word, isReview: true, isFocus: false });
      }

      // 2. 10問に満たない場合、未学習単語を pointer から順に追加
      let pointer = appData.newWordPointer || 1;
      while (setList.length < SET_SIZE_1900 && pointer <= vocab.length) {
        const word = vocab.find(v => v.id === pointer);
        if (word && !wp[word.id] && !setList.find(w => w.id === word.id)) {
          setList.push({ ...word, isReview: false, isFocus: false });
        }
        pointer++;
      }

      // 3. それでも10問未満なら既習単語からランダム補充
      if (setList.length < SET_SIZE_1900) {
        const allWordIds = Object.keys(wp).map(Number);
        const remainShuffle = allWordIds.sort(() => Math.random() - 0.5);
        for (const id of remainShuffle) {
          if (setList.length >= SET_SIZE_1900) break;
          if (!setList.find(w => w.id === id)) {
            const word = vocab.find(v => v.id === id);
            if (word) setList.push({ ...word, isReview: true, isFocus: false });
          }
        }
      }

      return {
        setList: setList.sort(() => Math.random() - 0.5),
        newPointer: Math.min(pointer, vocab.length + 1)
      };
    }

    // --- 基本1200モード用：間違い重点・高速ふるい落とし型セット作成関数 ---
    function createNextSetBasic(appData, vocab, today) {
      let setList = [];
      const wp = appData.basicWordProgress || {};
      const MAX_FOCUS_IN_SET = 12; // 新規単語も適度に混ぜつつ、間違い単語を最大60%優先

      // 1. 最優先：間違えた単語（needsFocus）かつ復習期日 <= 今日
      // 間違い回数(wrong)が多い順、同率ならシャッフルで優先度付け
      const focusDueIds = Object.keys(wp)
        .map(Number)
        .filter(id => wp[id].needsFocus && wp[id].nextReview && wp[id].nextReview <= today)
        .sort((a, b) => {
          const diff = (wp[b].wrong || 0) - (wp[a].wrong || 0);
          return diff !== 0 ? diff : (Math.random() - 0.5);
        });

      for (const id of focusDueIds) {
        if (setList.length >= MAX_FOCUS_IN_SET) break;
        const word = vocab.find(v => v.id === id);
        if (word) setList.push({ ...word, isReview: true, isFocus: true, wrongCount: wp[id].wrong || 1 });
      }

      // 2. 次優先：3秒超えで迷った単語・通常復習期日到来（!needsFocus && nextReview <= 今日）
      const normalDueIds = Object.keys(wp)
        .map(Number)
        .filter(id => !wp[id].needsFocus && wp[id].nextReview && wp[id].nextReview <= today && wp[id].level > 0)
        .sort(() => Math.random() - 0.5);

      for (const id of normalDueIds) {
        if (setList.length >= MAX_FOCUS_IN_SET) break;
        const word = vocab.find(v => v.id === id);
        if (word && !setList.find(w => w.id === word.id)) {
          setList.push({ ...word, isReview: true, isFocus: false });
        }
      }

      // 3. 新規単語をポインタから順番に追加（未学習の単語をサクサク進める）
      let pointer = appData.basicNewWordPointer || 1;
      let scan = pointer;
      while (setList.length < SET_SIZE_BASIC && scan <= vocab.length) {
        const word = vocab.find(v => v.id === scan);
        if (word && !wp[word.id] && !setList.find(w => w.id === word.id)) {
          setList.push({ ...word, isReview: false, isFocus: false });
        }
        scan++;
      }

      // ポインタ前方に未学習単語が万一残っていれば拾う
      if (setList.length < SET_SIZE_BASIC) {
        for (const word of vocab) {
          if (setList.length >= SET_SIZE_BASIC) break;
          if (!wp[word.id] && !setList.find(w => w.id === word.id)) {
            setList.push({ ...word, isReview: false, isFocus: false });
          }
        }
      }

      // 4. まだ20問未満（全単語を一巡済み）なら、残りの重点復習単語を投入
      if (setList.length < SET_SIZE_BASIC) {
        for (const id of focusDueIds) {
          if (setList.length >= SET_SIZE_BASIC) break;
          if (!setList.find(w => w.id === id)) {
            const word = vocab.find(v => v.id === id);
            if (word) setList.push({ ...word, isReview: true, isFocus: true, wrongCount: wp[id].wrong || 1 });
          }
        }
      }

      // 5. それでも足りなければ、過去に間違えた履歴がある単語を優先してランダム補充
      if (setList.length < SET_SIZE_BASIC) {
        const pastWrongIds = Object.keys(wp)
          .map(Number)
          .filter(id => (wp[id].wrong || 0) > 0 && !setList.find(w => w.id === id))
          .sort((a, b) => ((wp[b].wrong || 0) - (wp[a].wrong || 0)) || (Math.random() - 0.5));
        for (const id of pastWrongIds) {
          if (setList.length >= SET_SIZE_BASIC) break;
          const word = vocab.find(v => v.id === id);
          if (word) setList.push({ ...word, isReview: true, isFocus: true, wrongCount: wp[id].wrong || 1 });
        }
      }

      // 6. 最終フォールバック：全単語からランダム補充
      if (setList.length < SET_SIZE_BASIC) {
        const shuffledAll = [...vocab].sort(() => Math.random() - 0.5);
        for (const word of shuffledAll) {
          if (setList.length >= SET_SIZE_BASIC) break;
          if (!setList.find(w => w.id === word.id)) {
            setList.push({ ...word, isReview: true, isFocus: false });
          }
        }
      }

      return {
        setList: setList.sort(() => Math.random() - 0.5),
        newPointer: Math.min(scan, vocab.length + 1)
      };
    }

    // 紙吹雪パーティクル定義
    const CONFETTI_COLORS = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#facc15'];
    const CONFETTI_ITEMS = Array.from({ length: 26 }, (_, i) => {
      const angle = (i / 26) * Math.PI * 2 + (i % 3) * 0.1;
      const dist = 95 + (i % 4) * 38;
      return {
        id: i,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        tx: `${Math.round(Math.cos(angle) * dist)}px`,
        ty: `${Math.round(Math.sin(angle) * dist - 20)}px`,
        rot: `${(i % 2 === 0 ? 1 : -1) * (180 + (i * 37) % 360)}deg`
      };
    });

    function App() {
      const [appData, setAppData] = useState(loadAppData);
      const [mode, setMode] = useState(() => loadAppData().lastMode || '1900');
      const today = getTodayJST();

      const activeVocab = mode === 'basic' ? VOCAB_BASIC : VOCAB_1900;

      // 初回セットの生成
      const [currentSet, setCurrentSet] = useState(() => {
        const initData = loadAppData();
        const initMode = initData.lastMode || '1900';
        const res = initMode === 'basic'
          ? createNextSetBasic(initData, VOCAB_BASIC, today)
          : createNextSet1900(initData, VOCAB_1900, today);
        return res.setList;
      });

      const [questionIdx, setQuestionIdx] = useState(0);
      const [isSetFinished, setIsSetFinished] = useState(false);
      const [wrongAnswers, setWrongAnswers] = useState([]);
      const [setStats, setSetStats] = useState({ correct: 0, fastCount: 0, masteredNew: 0, completionsInSet: 0 });
      const [options, setOptions] = useState([]);
      const [qType, setQType] = useState('en-ja');
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [showDashboard, setShowDashboard] = useState(false);
      const [showBurstEffect, setShowBurstEffect] = useState(false);

      // タイマー関連
      const [timeLeft, setTimeLeft] = useState(BONUS_LIMIT_MS);
      const timerRef = useRef(null);
      const nextTimeoutRef = useRef(null);
      const burstTimeoutRef = useRef(null);
      const startTimeRef = useRef(0);

      // 今日の統計（正規化済み）
      const todayStats = normalizeDailyStat(appData.dailyStats[today]);
      const info1900 = pointsToMinutesInfo(todayStats.points);
      const basicMinutesToday = todayStats.basicCompletions * BASIC_REWARD_MINUTES;
      const totalMinutesToday = info1900.exactMin + basicMinutesToday;

      // body背景テーマ同期
      useEffect(() => {
        if (mode === 'basic') {
          document.body.classList.add('mode-basic');
        } else {
          document.body.classList.remove('mode-basic');
        }
      }, [mode]);

      // 音声読み上げ
      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const ut = new SpeechSynthesisUtterance(text);
          ut.lang = 'en-US';
          window.speechSynthesis.speak(ut);
        }
      };

      // 問題準備関数
      const prepareQuestion = useCallback((word, targetMode) => {
        if (!word) return;
        const vocabList = targetMode === 'basic' ? VOCAB_BASIC : VOCAB_1900;
        const dummyCount = targetMode === 'basic' ? 2 : 3; // 基本モードは3択、1900は4択
        const type = Math.random() > 0.5 ? 'en-ja' : 'ja-en';
        setQType(type);

        const dummies = [];
        while (dummies.length < dummyCount) {
          const rand = vocabList[Math.floor(Math.random() * vocabList.length)];
          if (rand.id !== word.id && !dummies.find(d => d.id === rand.id)) {
            dummies.push(rand);
          }
        }
        const allOpts = [word, ...dummies].sort(() => Math.random() - 0.5);
        setOptions(allOpts);
        setSelectedAnswer(null);
        setFeedback(null);

        setTimeLeft(BONUS_LIMIT_MS);
        startTimeRef.current = Date.now();
        if (timerRef.current) clearInterval(timerRef.current);

        timerRef.current = setInterval(() => {
          const elapsed = Date.now() - startTimeRef.current;
          const rem = Math.max(0, BONUS_LIMIT_MS - elapsed);
          setTimeLeft(rem);
        }, 50);

        if (type === 'en-ja') {
          speak(word.en);
        }
      }, []);

      // スリープ復帰時やタブ復帰時に日付が変わっていたら自動リロード
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            const currentJST = getTodayJST();
            if (currentJST !== today) {
              window.location.reload();
            }
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('focus', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('focus', handleVisibilityChange);
        };
      }, [today]);

      // 初回問題のセットアップ
      useEffect(() => {
        if (currentSet.length > 0) {
          prepareQuestion(currentSet[0], mode);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
          if (nextTimeoutRef.current) clearTimeout(nextTimeoutRef.current);
          if (burstTimeoutRef.current) clearTimeout(burstTimeoutRef.current);
        };
      }, []);

      // モード切替
      const handleSwitchMode = (nextMode) => {
        if (nextMode === mode && !showDashboard) return;
        if (timerRef.current) clearInterval(timerRef.current);
        if (nextTimeoutRef.current) clearTimeout(nextTimeoutRef.current);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const res = nextMode === 'basic'
          ? createNextSetBasic(appData, VOCAB_BASIC, today)
          : createNextSet1900(appData, VOCAB_1900, today);

        const updated = { ...appData, lastMode: nextMode };
        setAppData(updated);
        saveAppData(updated);

        setMode(nextMode);
        setCurrentSet(res.setList);
        setQuestionIdx(0);
        setIsSetFinished(false);
        setWrongAnswers([]);
        setSetStats({ correct: 0, fastCount: 0, masteredNew: 0, completionsInSet: 0 });
        setFeedback(null);
        setShowDashboard(false);
        setShowBurstEffect(false);

        if (res.setList.length > 0) {
          prepareQuestion(res.setList[0], nextMode);
        }
      };

      // 効果音ON/OFF切替
      const toggleSound = () => {
        const updated = { ...appData, soundEnabled: !appData.soundEnabled };
        setAppData(updated);
        saveAppData(updated);
      };

      // 次のセットに進む
      const handleNextSet = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        if (nextTimeoutRef.current) clearTimeout(nextTimeoutRef.current);

        let setList = [];
        let updated = { ...appData };

        if (mode === 'basic') {
          const res = createNextSetBasic(appData, VOCAB_BASIC, today);
          setList = res.setList;
          updated.basicNewWordPointer = res.newPointer;
        } else {
          const res = createNextSet1900(appData, VOCAB_1900, today);
          setList = res.setList;
          updated.newWordPointer = res.newPointer;
        }

        setAppData(updated);
        saveAppData(updated);

        setCurrentSet(setList);
        setQuestionIdx(0);
        setIsSetFinished(false);
        setWrongAnswers([]);
        setSetStats({ correct: 0, fastCount: 0, masteredNew: 0, completionsInSet: 0 });
        setFeedback(null);
        setShowDashboard(false);

        if (setList.length > 0) {
          prepareQuestion(setList[0], mode);
        }
      };

      // 解答処理
      const handleAnswer = (opt) => {
        if (selectedAnswer) return;
        if (timerRef.current) clearInterval(timerRef.current);

        const currentWord = currentSet[questionIdx];
        if (!currentWord) return;

        const isCorrect = opt.id === currentWord.id;
        const timeTaken = Date.now() - startTimeRef.current;
        const isFast = isCorrect && timeTaken <= BONUS_LIMIT_MS;

        setSelectedAnswer({ optId: opt.id, isCorrect });

        const updatedDailyStats = { ...appData.dailyStats };
        const todayStat = normalizeDailyStat(updatedDailyStats[today]);
        const updatedTodayStat = {
          ...todayStat,
          rewardedWords: [...todayStat.rewardedWords],
          basicRewardedWords: [...todayStat.basicRewardedWords]
        };
        updatedDailyStats[today] = updatedTodayStat;

        let updatedData = {
          ...appData,
          dailyStats: updatedDailyStats
        };

        let feedbackMsg = '';
        let delayMs = 1100;
        let triggeredBurst = false;

        if (mode === 'basic') {
          // --- 基本1200モードの処理 ---
          const updatedBasicWP = { ...appData.basicWordProgress };
          const prevWp = updatedBasicWP[currentWord.id] || {
            level: 0,
            nextReview: today,
            lastReview: '',
            correct: 0,
            wrong: 0,
            needsFocus: false,
            streak: 0
          };
          const wp = { ...prevWp };
          let newlyMastered = false;

          if (isCorrect) {
            wp.correct = (wp.correct || 0) + 1;
            wp.lastReview = today;
            wp.streak = (wp.streak || 0) + 1;

            if (wp.level === 0 && (wp.wrong || 0) === 0) {
              // 初見の単語
              if (isFast) {
                // 3秒以内の即答：定着済みとして長期スキップ
                wp.level = 6;
                wp.needsFocus = false;
                wp.nextReview = addDays(today, BASIC_MASTER_INTERVAL_DAYS);
                newlyMastered = true;
              } else {
                // 3秒超え正解：少し迷ったので3日後に確認
                wp.level = 2;
                wp.needsFocus = false;
                wp.nextReview = addDays(today, 3);
              }
            } else if (wp.needsFocus) {
              // 間違えたことがある重点復習単語
              const nextLv = Math.min(5, (wp.level || 0) + 1);
              wp.level = nextLv;
              const intervalDays = SRS_INTERVALS[nextLv - 1] || 1;
              wp.nextReview = addDays(today, intervalDays);
              // 3回連続正解で重点復習から卒業
              if (wp.streak >= 3) {
                wp.needsFocus = false;
              }
            } else {
              // 通常復習で正解
              const nextLv = Math.min(6, (wp.level || 1) + 1);
              wp.level = nextLv;
              const intervalDays = nextLv >= 6 ? BASIC_MASTER_INTERVAL_DAYS : (SRS_INTERVALS[nextLv - 1] || 7);
              wp.nextReview = addDays(today, intervalDays);
            }

            if (isFast) {
              if (!updatedTodayStat.basicRewardedWords.includes(currentWord.id)) {
                updatedTodayStat.basicRewardedWords.push(currentWord.id);
                updatedTodayStat.basicFastCorrect += 1;
                const nextGauge = (updatedData.basicGaugeCount || 0) + 1;

                if (nextGauge >= BASIC_GAUGE_TARGET) {
                  updatedData.basicGaugeCount = 0;
                  updatedTodayStat.basicCompletions += 1;
                  triggeredBurst = true;
                  feedbackMsg = `🎉 50問達成！ +${BASIC_REWARD_MINUTES}分 GET! ゲージリセット！`;
                  if (appData.soundEnabled) SoundEngine.playBurst();
                  setShowBurstEffect(true);
                  if (burstTimeoutRef.current) clearTimeout(burstTimeoutRef.current);
                  burstTimeoutRef.current = setTimeout(() => setShowBurstEffect(false), 1550);
                  setSetStats(prev => ({
                    ...prev,
                    correct: prev.correct + 1,
                    fastCount: prev.fastCount + 1,
                    masteredNew: prev.masteredNew + (newlyMastered ? 1 : 0),
                    completionsInSet: prev.completionsInSet + 1
                  }));
                } else {
                  updatedData.basicGaugeCount = nextGauge;
                  feedbackMsg = newlyMastered
                    ? `⚡ 即答マスター！ ゲージ ${nextGauge}/${BASIC_GAUGE_TARGET}`
                    : `⚡ 3秒以内正解！ ゲージ ${nextGauge}/${BASIC_GAUGE_TARGET}`;
                  if (appData.soundEnabled) SoundEngine.playCharge(nextGauge);
                  setSetStats(prev => ({
                    ...prev,
                    correct: prev.correct + 1,
                    fastCount: prev.fastCount + 1,
                    masteredNew: prev.masteredNew + (newlyMastered ? 1 : 0)
                  }));
                }
              } else {
                feedbackMsg = '✅ 正解！（本日はカウント済み）';
                if (appData.soundEnabled) SoundEngine.playSoftCorrect();
                setSetStats(prev => ({
                  ...prev,
                  correct: prev.correct + 1,
                  fastCount: prev.fastCount + 1
                }));
              }
            } else {
              feedbackMsg = '✅ 正解！（3秒超えのためゲージ対象外）';
              if (appData.soundEnabled) SoundEngine.playSoftCorrect();
              setSetStats(prev => ({ ...prev, correct: prev.correct + 1 }));
            }

            delayMs = triggeredBurst ? 1600 : 550;
          } else {
            // 不正解：重点復習枠に登録し、当日最優先で再出題
            wp.wrong = (wp.wrong || 0) + 1;
            wp.streak = 0;
            wp.level = 1;
            wp.needsFocus = true;
            wp.nextReview = today;
            wp.lastReview = today;
            setWrongAnswers(prev => [...prev, currentWord]);
            feedbackMsg = `❌ 正解は「${qType === 'en-ja' ? currentWord.ja : currentWord.en}」`;
            if (appData.soundEnabled) SoundEngine.playWrong();
            delayMs = 1400;
          }

          updatedBasicWP[currentWord.id] = wp;
          updatedData.basicWordProgress = updatedBasicWP;
        } else {
          // --- ターゲット1900モードの処理（従来仕様を維持） ---
          const updatedWP = { ...appData.wordProgress };
          const prevWp = updatedWP[currentWord.id] || {
            level: 0,
            nextReview: today,
            lastReview: today,
            correct: 0,
            wrong: 0
          };
          const wp = { ...prevWp };

          if (isCorrect) {
            wp.correct = (wp.correct || 0) + 1;
            wp.lastReview = today;
            const newLevel = Math.min(5, (wp.level || 0) + 1);
            wp.level = newLevel;
            const intervalDays = SRS_INTERVALS[newLevel - 1] || 1;
            wp.nextReview = addDays(today, intervalDays);

            if (isFast) {
              if (!updatedTodayStat.rewardedWords.includes(currentWord.id)) {
                updatedTodayStat.points += 1;
                updatedTodayStat.rewardedWords.push(currentWord.id);
                feedbackMsg = '⚡ 3秒以内正解！+1pt ボーナス！';
                if (appData.soundEnabled) SoundEngine.playSoftCorrect();
              } else {
                feedbackMsg = '✅ 正解！（本日のボーナス獲得済み）';
                if (appData.soundEnabled) SoundEngine.playSoftCorrect();
              }
              setSetStats(prev => ({ ...prev, correct: prev.correct + 1, fastCount: prev.fastCount + 1 }));
            } else {
              feedbackMsg = '✅ 正解！';
              if (appData.soundEnabled) SoundEngine.playSoftCorrect();
              setSetStats(prev => ({ ...prev, correct: prev.correct + 1 }));
            }
          } else {
            wp.wrong = (wp.wrong || 0) + 1;
            wp.level = 1;
            wp.nextReview = today;
            setWrongAnswers(prev => [...prev, currentWord]);
            feedbackMsg = `❌ 正解は「${qType === 'en-ja' ? currentWord.ja : currentWord.en}」`;
            if (appData.soundEnabled) SoundEngine.playWrong();
          }

          updatedWP[currentWord.id] = wp;
          updatedData.wordProgress = updatedWP;
          delayMs = 1100;
        }

        setFeedback(feedbackMsg);
        setAppData(updatedData);
        saveAppData(updatedData);

        if (nextTimeoutRef.current) clearTimeout(nextTimeoutRef.current);
        nextTimeoutRef.current = setTimeout(() => {
          const next = questionIdx + 1;
          if (next < currentSet.length) {
            setQuestionIdx(next);
            prepareQuestion(currentSet[next], mode);
          } else {
            setIsSetFinished(true);
          }
        }, delayMs);
      };

      // 基本モード統計集計
      const basicWP = appData.basicWordProgress || {};
      const basicLearnedCount = Object.keys(basicWP).length;
      const basicMasteredCount = Object.values(basicWP).filter(w => w.level >= 6 && !w.needsFocus).length;
      const basicFocusCount = Object.values(basicWP).filter(w => w.needsFocus).length;

      // ゲージの視覚ティア計算
      const gaugeVal = appData.basicGaugeCount || 0;
      const gaugePercent = Math.min(100, (gaugeVal / BASIC_GAUGE_TARGET) * 100);
      const gaugeTierClass = gaugeVal >= 45 ? 'tier-4' : gaugeVal >= 35 ? 'tier-3' : gaugeVal >= 20 ? 'tier-2' : 'tier-1';
      const gaugeBoxClass = gaugeVal >= 45 ? 'gauge-container gauge-max' : gaugeVal >= 35 ? 'gauge-container gauge-hot' : 'gauge-container';

      if (!currentSet || currentSet.length === 0) {
        return <div className="app-card" style={{ textAlign: 'center', padding: '40px' }}>単語データを準備中...</div>;
      }

      const currentWord = currentSet[questionIdx];

      return (
        <div className={`app-card ${mode === 'basic' ? 'card-basic' : ''}`}>
          {/* 50問達成時の弾ける演出オーバーレイ */}
          {showBurstEffect && (
            <div className="burst-overlay">
              {CONFETTI_ITEMS.map(c => (
                <div
                  key={c.id}
                  className="confetti-piece"
                  style={{
                    backgroundColor: c.color,
                    '--tx': c.tx,
                    '--ty': c.ty,
                    '--rot': c.rot
                  }}
                />
              ))}
              <div className="burst-banner">
                <div style={{ fontSize: '26px', marginBottom: '2px' }}>🎉 50問達成！ 🎉</div>
                <div style={{ fontSize: '20px', fontWeight: '900' }}>+{BASIC_REWARD_MINUTES}分 GET!</div>
              </div>
            </div>
          )}

          {/* モード切替タブ */}
          <div className="mode-switcher">
            <button
              className={`mode-tab ${mode === '1900' ? 'active-1900' : ''}`}
              onClick={() => handleSwitchMode('1900')}
            >
              📘 ターゲット1900
            </button>
            <button
              className={`mode-tab ${mode === 'basic' ? 'active-basic' : ''}`}
              onClick={() => handleSwitchMode('basic')}
            >
              ⚡ 基本1200（3択）
            </button>
          </div>

          {/* 共通ヘッダー */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px', borderBottom: '1px solid #edf2f7', paddingBottom: '10px', gap: '8px' }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: '12px', color: '#718096', display: 'flex', alignItems: 'center', gap: '4px', marginBottom: '4px' }}>
                <span>本日 JST: {today}</span>
                <button
                  onClick={() => window.location.reload()}
                  style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: '12px', padding: '0 2px' }}
                  title="日付・画面を再読み込み"
                >
                  🔄
                </button>
              </div>
              {mode === '1900' ? (
                <div style={{ fontSize: '17px', fontWeight: 'bold', color: '#2b6cb0', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
                  <span>⚡ {todayStats.points} <span style={{ fontSize: '13px', color: '#4a5568' }}>pt</span></span>
                  <span style={{ fontSize: '12px', background: '#ebf8ff', color: '#2b6cb0', border: '1px solid #bee3f8', padding: '2px 7px', borderRadius: '6px' }}>
                    1900: {info1900.displayMin}分 ({info1900.currentRate}%)
                  </span>
                </div>
              ) : (
                <div style={{ fontSize: '17px', fontWeight: 'bold', color: '#0d9488', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
                  <span>🚀 +{basicMinutesToday} <span style={{ fontSize: '13px', color: '#4a5568' }}>分</span></span>
                  <span style={{ fontSize: '12px', background: '#e6fffa', color: '#0f766e', border: '1px solid #99f6e4', padding: '2px 7px', borderRadius: '6px' }}>
                    50問達成 × {todayStats.basicCompletions}回
                  </span>
                </div>
              )}
              <div style={{ fontSize: '11px', color: '#718096', marginTop: '4px' }}>
                本日合計: <strong style={{ color: '#2d3748' }}>約 {totalMinutesToday.toFixed(1)}分</strong>（1900: {info1900.displayMin}分 ＋ 基本: {basicMinutesToday}分）
              </div>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '5px', alignItems: 'flex-end' }}>

                style={{ fontSize: '12px', background: '#edf2f7', border: 'none', padding: '6px 10px', borderRadius: '8px', cursor: 'pointer', color: '#2d3748', fontWeight: '700' }}

                {showDashboard ? '戻る' : '📊 統計'}
              </button>
              <button
                onClick={toggleSound}
                style={{ fontSize: '11px', background: appData.soundEnabled ? '#f0fdf4' : '#f7fafc', border: '1px solid #e2e8f0', padding: '3px 8px', borderRadius: '8px', cursor: 'pointer', color: appData.soundEnabled ? '#15803d' : '#718096', fontWeight: '600' }}

              >
                {appData.soundEnabled ? '🔊 効果音ON' : '🔇 効果音OFF'}
              </button>
            </div>
          </div>

                <div className="gauge-ticks">

                  <div className="gauge-tick" />
                  <div className="gauge-tick" />

              </div>

                <div style={{ fontSize: '26px', fontWeight: '900', margin: '2px 0 6px 0' }}>

                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', fontSize: '12px' }}>

                  <span style={{ background: 'rgba(16, 185, 129, 0.25)', border: '1px solid #34d399', padding: '3px 8px', borderRadius: '6px' }}>
                    ⚡ 基本1200: {basicMinutesToday}分
                  </span>
                </div>
              </div>

              {/* モード別内訳カード①：基本1200 */}
              <div style={{ background: '#f0fdfa', border: '1.5px solid #99f6e4', padding: '14px', borderRadius: '12px', marginBottom: '10px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <span style={{ fontSize: '14px', fontWeight: '800', color: '#0f766e' }}>⚡ 基本1200モード（50問＝15分）</span>
                  <span style={{ fontSize: '16px', fontWeight: '900', color: '#0d9488' }}>+{basicMinutesToday} 分</span>
                </div>
                <div style={{ fontSize: '12px', color: '#2d3748', lineHeight: '1.6' }}>
                  ・本日の50問達成回数：<strong>{todayStats.basicCompletions} 回</strong>（本日3秒即答: {todayStats.basicFastCorrect}問）<br />
                  ・現在の持ち越しゲージ：<strong>{gaugeVal} / {BASIC_GAUGE_TARGET}</strong>（あと{BASIC_GAUGE_TARGET - gaugeVal}問で+15分）<br />
                  ・進捗（全{VOCAB_BASIC.length}語）：学習済 <strong>{basicLearnedCount}語</strong> ／ 即答マスター <strong>{basicMasteredCount}語</strong> ／ 重点復習中 <strong style={{ color: '#e53e3e' }}>{basicFocusCount}語</strong>
                </div>
              </div>

              {/* モード別内訳カード②：ターゲット1900 */}
              <div style={{ background: '#ebf8ff', border: '1.5px solid #bee3f8', padding: '14px', borderRadius: '12px', marginBottom: '14px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <span style={{ fontSize: '14px', fontWeight: '800', color: '#2b6cb0' }}>📘 ターゲット1900モード（時間逓減制）</span>
                  <span style={{ fontSize: '16px', fontWeight: '900', color: '#2b6cb0' }}>約 {info1900.displayMin} 分</span>
                </div>
                <div style={{ fontSize: '12px', color: '#2d3748', lineHeight: '1.6' }}>
                  ・本日ポイント：<strong>{todayStats.points} pt</strong>（現在の換算レート：<strong style={{ color: '#e53e3e' }}>{info1900.currentRate}%</strong>）<br />
                  ・レート基準：〜20分:100% / 〜40分:80% / 〜60分:60% / 〜80分:50% / 〜100分:40% / 〜120分:30% / 120分超:20%<br />
                  ・進捗（全{VOCAB_1900.length}語）：学習開始済 <strong>{Object.keys(appData.wordProgress || {}).length}語</strong>
                </div>
              </div>

              {/* 直近の履歴 */}
              <div style={{ marginBottom: '14px' }}>
                <div style={{ fontSize: '13px', fontWeight: 'bold', color: '#4a5568', marginBottom: '6px' }}>
                  直近の履歴 (JST)
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  {Object.keys(appData.dailyStats).sort().reverse().slice(0, 7).map(dateKey => {
                    const ds = normalizeDailyStat(appData.dailyStats[dateKey]);
                    const m1900 = pointsToMinutesInfo(ds.points);
                    const mBasic = ds.basicCompletions * BASIC_REWARD_MINUTES;
                    const mSum = m1900.exactMin + mBasic;
                    return (
                      <div key={dateKey} style={{ padding: '8px 10px', background: dateKey === today ? '#edf2f7' : '#f7fafc', border: dateKey === today ? '1px solid #cbd5e0' : '1px solid #edf2f7', borderRadius: '8px', fontSize: '12px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '2px' }}>
                          <span style={{ fontWeight: dateKey === today ? '800' : '600' }}>{dateKey} {dateKey === today ? '(今日)' : ''}</span>
                          <strong style={{ color: '#1a202c' }}>計 約{mSum.toFixed(1)}分</strong>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#4a5568' }}>
                          <span style={{ color: '#2b6cb0' }}>📘 1900: {ds.points}pt ({m1900.displayMin}分)</span>
                          <span style={{ color: '#0f766e' }}>⚡ 基本: {ds.basicCompletions}回 ({mBasic}分)</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <button
                onClick={() => setShowDashboard(false)}
                style={{ width: '100%', padding: '12px', background: mode === 'basic' ? '#0d9488' : '#3182ce', color: '#fff', border: 'none', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer' }}
              >
                学習に戻る
              </button>
            </div>
          ) : !isSetFinished && currentWord ? (
            /* 出題中画面 */
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                  {mode === 'basic' ? (
                    <span
                      className="badge"
                      style={{
                        background: currentWord.isFocus ? '#fed7d7' : currentWord.isReview ? '#feebc8' : '#e6fffa',
                        color: currentWord.isFocus ? '#9b2c2c' : currentWord.isReview ? '#c05621' : '#0f766e'
                      }}
                    >
                      {currentWord.isFocus
                        ? `🔥 重点復習${currentWord.wrongCount ? ` (誤${currentWord.wrongCount})` : ''}`
                        : currentWord.isReview
                          ? '確認復習'
                          : '基本新規'}
                    </span>
                  ) : (
                    <span
                      className="badge"
                      style={{
                        background: currentWord.isReview ? '#feebc8' : '#ebf8ff',
                        color: currentWord.isReview ? '#c05621' : '#2b6cb0'
                      }}
                    >
                      {currentWord.isReview ? 'SRS復習' : '新規単語'}
                    </span>
                  )}
                  <span style={{ fontSize: '12px', color: '#a0aec0' }}>
                    {mode === 'basic' ? `基本 No.${currentWord.id}` : `1900 No.${currentWord.id}`}
                  </span>
                </div>
                <span style={{ fontSize: '13px', color: '#718096', fontWeight: '700' }}>
                  {questionIdx + 1} / {currentSet.length}
                </span>
              </div>

              {/* タイマーバー */}
              <div className="timer-bar-bg">
                <div
                  className="timer-bar-fill"
                  style={{ width: `${(timeLeft / BONUS_LIMIT_MS) * 100}%` }}
                />
              </div>

              {/* 単語表示 */}
              <div style={{ textAlign: 'center', margin: '14px 0 20px 0' }}>
                <div style={{ fontSize: '12px', color: '#a0aec0', letterSpacing: '0.5px', marginBottom: '6px' }}>
                  {qType === 'en-ja' ? '英語 ➔ 日本語' : '日本語 ➔ 英語'}
                </div>
                <div style={{ fontSize: qType === 'en-ja' ? '32px' : '24px', fontWeight: 'bold', color: '#2d3748', minHeight: '44px', lineHeight: '1.3' }}>
                  {qType === 'en-ja' ? currentWord.en : currentWord.ja}
                </div>
                <button
                  onClick={() => speak(currentWord.en)}
                  style={{ marginTop: '10px', background: '#f7fafc', border: '1px solid #e2e8f0', padding: '5px 14px', borderRadius: '20px', fontSize: '12px', color: '#4a5568', cursor: 'pointer' }}
                >
                  🔊 発音
                </button>
              </div>

              {/* フィードバック通知 */}
              {feedback && (
                <div
                  style={{
                    textAlign: 'center',
                    fontSize: '13px',
                    fontWeight: 'bold',
                    padding: '8px',
                    marginBottom: '12px',
                    borderRadius: '8px',
                    background: selectedAnswer?.isCorrect ? '#c6f6d5' : '#fed7d7',
                    color: selectedAnswer?.isCorrect ? '#22543d' : '#742a2a'
                  }}
                >
                  {feedback}
                </div>
              )}

              {/* 選択肢ボタン（基本1200は3択、ターゲット1900は4択） */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '10px' }}>
                {options.map((opt) => {
                  let borderCol = '#e2e8f0';
                  let bgCol = '#ffffff';
                  let textCol = '#2d3748';

                  if (selectedAnswer) {
                    if (opt.id === currentWord.id) {
                      borderCol = '#38a169';
                      bgCol = '#c6f6d5';
                      textCol = '#22543d';
                    } else if (opt.id === selectedAnswer.optId && !selectedAnswer.isCorrect) {
                      borderCol = '#e53e3e';
                      bgCol = '#fed7d7';
                      textCol = '#742a2a';
                    }
                  }

                  return (
                    <button
                      key={opt.id}
                      className="btn-option"
                      style={{ borderColor: borderCol, backgroundColor: bgCol, color: textCol }}
                      onClick={() => handleAnswer(opt)}
                      disabled={selectedAnswer !== null}
                    >
                      <span>{qType === 'en-ja' ? opt.ja : opt.en}</span>
                    </button>
                  );

              </div>
            </div>
          ) : mode === 'basic' ? (
            /* リザルト画面：基本1200モード専用（1900と明確に区別） */
            <div>
              <div style={{ background: 'linear-gradient(135deg, #0d9488, #10b981)', color: '#ffffff', borderRadius: '16px', padding: '18px 16px', textAlign: 'center', marginBottom: '14px' }}>
                <div style={{ fontSize: '12px', fontWeight: '700', opacity: 0.9, letterSpacing: '0.5px' }}>
                  ⚡ 基本単語（ターゲット1200）モード
                </div>
                <h2 style={{ margin: '6px 0 4px 0', fontSize: '21px' }}>🚀 20問セット完了！</h2>
                <div style={{ fontSize: '13px', opacity: 0.95 }}>
                  正解: <strong>{setStats.correct} / {currentSet.length}問</strong>（3秒即答: {setStats.fastCount}問）
                </div>
                {setStats.completionsInSet > 0 && (
                  <div style={{ marginTop: '8px', display: 'inline-block', background: '#fef08a', color: '#92400e', fontWeight: '900', fontSize: '13px', padding: '4px 12px', borderRadius: '999px' }}>
                    🎉 このセットで +{setStats.completionsInSet * BASIC_REWARD_MINUTES}分 獲得！
                  </div>
                )}
              </div>

              {/* 基本モードの本日獲得時間サマリー（親子の確認用） */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                <div style={{ background: '#f0fdfa', border: '1px solid #99f6e4', borderRadius: '10px', padding: '10px', textAlign: 'center' }}>
                  <div style={{ fontSize: '11px', color: '#0f766e', fontWeight: '700' }}>基本モード本日獲得</div>
                  <div style={{ fontSize: '20px', fontWeight: '900', color: '#0d9488' }}>+{basicMinutesToday} 分</div>
                  <div style={{ fontSize: '11px', color: '#718096' }}>50問達成 × {todayStats.basicCompletions}回</div>
                </div>
                <div style={{ background: '#fffbeb', border: '1px solid #fde68a', borderRadius: '10px', padding: '10px', textAlign: 'center' }}>
                  <div style={{ fontSize: '11px', color: '#92400e', fontWeight: '700' }}>次の+15分まで</div>
                  <div style={{ fontSize: '20px', fontWeight: '900', color: '#d97706' }}>あと {BASIC_GAUGE_TARGET - gaugeVal} 問</div>
                  <div style={{ fontSize: '11px', color: '#718096' }}>現在 {gaugeVal} / {BASIC_GAUGE_TARGET}</div>
                </div>
              </div>

              {setStats.masteredNew > 0 && (
                <div style={{ fontSize: '12px', color: '#0f766e', background: '#e6fffa', padding: '8px 12px', borderRadius: '8px', marginBottom: '12px', textAlign: 'center', fontWeight: '600' }}>

                </div>
              )}

              {/* 間違えた単語リスト */}
              {wrongAnswers.length > 0 ? (
                <div style={{ marginTop: '10px' }}>
                  <div style={{ fontSize: '13px', fontWeight: 'bold', color: '#e53e3e', marginBottom: '8px' }}>
                    🔥 間違えた単語（次回セットで最優先で重点出題されます）
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', maxHeight: '220px', overflowY: 'auto' }}>
                    {wrongAnswers.map((w, idx) => (
                      <div key={`${w.id}-${idx}`} style={{ background: '#fff5f5', borderLeft: '4px solid #e53e3e', padding: '8px 10px', borderRadius: '6px' }}>
                        <div style={{ fontWeight: 'bold', fontSize: '14px', color: '#2d3748' }}>基本 No.{w.id} {w.en}</div>
                        <div style={{ fontSize: '12px', color: '#4a5568' }}>{w.ja}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div style={{ background: '#f0fff4', border: '1px solid #c6f6d5', color: '#276749', padding: '14px', borderRadius: '12px', textAlign: 'center', fontWeight: 'bold', fontSize: '14px' }}>
                  🎉 20問パーフェクト！基礎がどんどん固まっています！
                </div>
              )}

              <div style={{ marginTop: '18px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button
                  onClick={handleNextSet}
                  style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, #0d9488, #10b981)', color: '#fff', border: 'none', borderRadius: '12px', fontWeight: 'bold', fontSize: '15px', cursor: 'pointer', boxShadow: '0 4px 10px rgba(13, 148, 136, 0.25)' }}
                >
                  次の20問へ進む ➔
                </button>
                <button
                  onClick={() => handleSwitchMode('1900')}
                  style={{ width: '100%', padding: '10px', background: '#ebf8ff', color: '#2b6cb0', border: '1px solid #bee3f8', borderRadius: '10px', fontWeight: '700', fontSize: '13px', cursor: 'pointer' }}
                >
                  📘 ターゲット1900モードに切り替える
                </button>
              </div>
            </div>
          ) : (
            /* リザルト画面：ターゲット1900モード専用 */
            <div>
              <div style={{ background: 'linear-gradient(135deg, #2b6cb0, #3182ce)', color: '#ffffff', borderRadius: '16px', padding: '18px 16px', textAlign: 'center', marginBottom: '14px' }}>
                <div style={{ fontSize: '12px', fontWeight: '700', opacity: 0.9, letterSpacing: '0.5px' }}>
                  📘 ターゲット1900 SRSモード
                </div>
                <h2 style={{ margin: '6px 0 4px 0', fontSize: '21px' }}>🎯 10問セット完了！</h2>
                <div style={{ fontSize: '13px', opacity: 0.95 }}>
                  正解: <strong>{setStats.correct} / {currentSet.length}問</strong> ｜ 本日1900獲得: <strong>{todayStats.points}pt (約{info1900.displayMin}分)</strong>
                </div>
              </div>

              {/* 要復習単語リスト */}
              {wrongAnswers.length > 0 ? (
                <div style={{ marginTop: '12px' }}>
                  <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#e53e3e', marginBottom: '8px' }}>
                    ⚠️ 間違えた単語（次回最優先で復習出題されます）
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {wrongAnswers.map((w, idx) => (
                      <div key={`${w.id}-${idx}`} style={{ background: '#fff5f5', borderLeft: '4px solid #e53e3e', padding: '10px 12px', borderRadius: '6px' }}>
                        <div style={{ fontWeight: 'bold', fontSize: '15px', color: '#2d3748' }}>No.{w.id} {w.en}</div>
                        <div style={{ fontSize: '13px', color: '#4a5568' }}>{w.ja}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div style={{ background: '#f0fff4', border: '1px solid #c6f6d5', color: '#276749', padding: '16px', borderRadius: '12px', textAlign: 'center', fontWeight: 'bold' }}>
                  🎉 全問正解！素晴らしい集中力です！
                </div>
              )}

              <div style={{ marginTop: '20px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button
                  onClick={handleNextSet}
                  style={{ width: '100%', padding: '14px', background: '#3182ce', color: '#fff', border: 'none', borderRadius: '12px', fontWeight: 'bold', fontSize: '15px', cursor: 'pointer' }}
                >
                  次の10問へ進む ➔
                </button>
                <button
                  onClick={() => handleSwitchMode('basic')}
                  style={{ width: '100%', padding: '10px', background: '#f0fdfa', color: '#0f766e', border: '1px solid #99f6e4', borderRadius: '10px', fontWeight: '700', fontSize: '13px', cursor: 'pointer' }}
                >
                  ⚡ 基本1200モードに切り替える（現在 {gaugeVal}/{BASIC_GAUGE_TARGET}）
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
